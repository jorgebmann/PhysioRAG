[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physiorag"
version = "0.1.0"
description = "Offline-first multi-modal RAG for physiological time-series data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jörg Bahlmann" }]
dependencies = [
    "numpy>=1.26",
    "wfdb>=4.1",
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "requests>=2.31",
    "matplotlib>=3.8",
    "weaviate-client>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
# Install once the local/git package is available:
#   pip install "physiorag[quant]"
quant = [
    "pyturboquant",
]

[project.scripts]
physiorag-ingest = "physiorag.pipeline.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
